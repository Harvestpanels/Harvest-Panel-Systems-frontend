<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Harvest Panel Systems | Insulated Metal Panels &amp; Doors</title>
    <meta name="description" content="Global distributor of Interior Insulated Metal Panels and Doors for Industrial, Commercial, and Residential projects. Stock inventory ships anywhere in the U.S. within 48 hours from our Oklahoma distribution center." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1b1d1f" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harvest Panel Systems" />
    <meta property="og:title" content="Harvest Panel Systems | Insulated Metal Panels &amp; Doors" />
    <meta property="og:description" content="Global distributor of Insulated Metal Panels and Doors. Stock inventory ships nationwide within 48 hours from Oklahoma." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@harvestpanels" />
    <meta name="twitter:title" content="Harvest Panel Systems | Insulated Metal Panels &amp; Doors" />
    <meta name="twitter:description" content="Global distributor of Insulated Metal Panels and Doors. Stock inventory ships nationwide within 48 hours." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Structured data for local business SEO (Google rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Harvest Panel Systems",
        "image": "/og-image.png",
        "telephone": "+1-405-778-2808",
        "email": "Sales@harvestpanels.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "7751 N County Line Rd.",
          "addressLocality": "Piedmont",
          "addressRegion": "OK",
          "postalCode": "73078",
          "addressCountry": "US"
        },
        "description": "Global distributor of exterior Insulated Metal Panels and Doors for Industrial, Commercial, and Residential projects."
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts — loaded here (not inside JS bundle) so fonts are
         requested before React mounts, eliminating FOUT on refresh. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://img1.wsimg.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Inline on purpose: this is the only CSS guaranteed to apply on the
         first paint. Every external stylesheet, index.css included, arrives a
         frame or two later, which is long enough for the browser to paint its
         default white canvas first. Literal hex rather than var(--hp-dark),
         since the token itself comes from a stylesheet. -->
    <style>
      html, body { margin: 0; background: #1b1d1f; }
      /* Reserved from the first paint, so the centred loading screen does not
         shift sideways when the real stylesheet arrives. */
      html { scrollbar-gutter: stable; }

      /* The loading screen, present in the HTML itself so there is no gap
         between the first paint and React mounting its own PageLoader. Sits
         outside #root so React's first render cannot wipe it; PageLoader
         removes it once it takes over (see PageLoader.jsx). */
      #hp-boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1b1d1f;
      }
      #hp-boot img {
        /* Same file and same 96px width as .hp-page-loader__logo, so the
           handover from this to React's loader is invisible. */
        width: 96px;
        height: auto;
        animation: hp-boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes hp-boot-pulse {
        0%, 100% { opacity: 0.55; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #hp-boot img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="hp-boot"><img src="/boot-logo.png" alt="" /></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
