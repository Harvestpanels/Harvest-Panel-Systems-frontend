<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Harvest Panel Systems | Insulated Metal Panels &amp; Doors</title>
    <!-- Set portal titles before the app bundle or authentication loads. -->
    <script>
      (() => {
        const titles = {
          "/portal": "Your documents",
          "/portal/profile": "Profile",
          "/portal/settings": "Settings",
          "/portal/admin": "Admin",
          "/portal/login": "Sign in",
          "/portal/signup": "Create an account",
          "/portal/forgot": "Reset password",
          "/portal/reset": "Choose a new password",
          "/portal/signout": "Signing out"
        };
        const path = window.location.pathname.replace(/\/+$/, "").toLowerCase();
        if (Object.hasOwn(titles, path)) {
          document.title = titles[path] + " | Harvest Panel Systems";
        }
      })();
    </script>
    <meta name="description" content="Global distributor of Interior Insulated Metal Panels and Doors for Industrial, Commercial, and Residential projects. Stock inventory ships anywhere in the U.S. within 48 hours from our Oklahoma distribution center." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1b1d1f" />

    <!-- Open Graph (Facebook, LinkedIn, iMessage previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harvest Panel Systems" />
    <meta property="og:url" content="https://harvestpanels.com/" />
    <link rel="canonical" href="https://harvestpanels.com/" />
    <meta property="og:title" content="Harvest Panel Systems | Insulated Metal Panels &amp; Doors" />
    <meta property="og:description" content="Global distributor of Insulated Metal Panels and Doors. Stock inventory ships nationwide within 48 hours from Oklahoma." />
    <meta property="og:image" content="https://harvestpanels.com/og-image.png" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@harvestpanels" />
    <meta name="twitter:title" content="Harvest Panel Systems | Insulated Metal Panels &amp; Doors" />
    <meta name="twitter:description" content="Global distributor of Insulated Metal Panels and Doors. Stock inventory ships nationwide within 48 hours." />
    <meta name="twitter:image" content="https://harvestpanels.com/og-image.png" />

    <!-- Structured data for local business SEO (Google rich results) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "LocalBusiness"],
        "@id": "https://harvestpanels.com/#organization",
        "name": "Harvest Panel Systems",
        "url": "https://harvestpanels.com/",
        "logo": "https://harvestpanels.com/icon-512.png",
        "image": "https://harvestpanels.com/og-image.png",
        "telephone": "+1-405-778-2808",
        "email": "Sales@harvestpanels.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "7751 N County Line Rd.",
          "addressLocality": "Piedmont",
          "addressRegion": "OK",
          "postalCode": "73078",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61555678774736",
          "https://www.instagram.com/harvestpanels/",
          "https://www.tiktok.com/@harvestpanels",
          "https://x.com/harvestpanels"
        ],
        "description": "Global distributor of interior and exterior Insulated Metal Panels and Doors for Industrial, Commercial, and Residential projects."
      }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts — loaded here (not inside JS bundle) so fonts are
         requested before React mounts, eliminating FOUT on refresh. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- One line, inline on purpose: this is the only CSS that applies on the
         very first paint. Every stylesheet, index.css included, arrives a frame
         or two later, and until then the browser paints its default white
         canvas — a brief white flash before the dark page appears. Literal hex
         rather than var(--hp-dark), since the token comes from a stylesheet. -->
    <style>html,body{margin:0;background:#1b1d1f}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
